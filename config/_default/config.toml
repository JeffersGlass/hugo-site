baseURL = 'https://jeff.glass'
languageCode = 'en-us'
title = 'Jeff Glass'
relativeURLs = true
pagerSize = 10
summaryLength = 10
enableRobotsTXT = true
googleAnalytics = ''
[taxonomies]
  category = 'categories'
  tag = 'tags'
  one-off-tag = 'oneofftags'
[markup.highlight]
  linenos = true
  style = 'manni'
[params]
  description = "Electronics, Making, Software Development, and Amateur Radio from a Midwest Nerd"
[markup.goldmark.renderer]
  unsafe= true
[security]
  allowContent = ['! ^text/org$']
  text = [ "html" ]
  [security.exec]
    allow = ['^(dart-)?sass(-embedded)?$', '^go$', '^git$', '^npx$', '^node$', '^postcss$', '^tailwindcss$']
  [security.node]
    [security.node.permissions]
      disable = true
      allowRead = ['.']
      allowChildProcess = ['tailwindcss'] # Add this if you use Tailwind CSS