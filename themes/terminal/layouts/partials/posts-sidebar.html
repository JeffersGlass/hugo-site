<aside class="sidebar archive-sidebar" aria-label="Post archive">
    <h2>All posts</h2>
    {{ $posts := where .Site.RegularPages "Section" "post" }}
    {{ range $posts.GroupByDate "2006" }}
    <details>
        <summary>{{ .Key }}</summary>
        <ul>
        {{ range .Pages }}
            <li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>
        {{ end }}
        </ul>
    </details>
    {{ end }}
</aside>
